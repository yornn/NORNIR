<!--
  Norse Calendar — панель настроек в UI SillyTavern

  Содержит:
    - Show widget: показывать/скрывать календарный виджет
    - Inject tag prompt: инжектить инструкцию <yorni> в промпт
    - Theme: откидное меню выбора темы оформления виджета
-->

<div class="norse-calendar-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Norse Calendar</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="nc-block">
                <label class="checkbox_label" for="nc_enabled">
                    <input id="nc_enabled" type="checkbox" />
                    <span>Show widget</span>
                </label>
                <label class="checkbox_label" for="nc_inject">
                    <input id="nc_inject" type="checkbox" />
                    <span>Inject tag prompt (infoblock mode)</span>
                </label>
                <label class="nc-theme-label" for="nc_theme">
                    <span>Theme</span>
                    <select id="nc_theme" class="text_pole">
                        <option value="default">Default (тёмная)</option>
                        <option value="light">Light (светлая)</option>
                        <option value="midnight">Midnight (ночное море)</option>
                        <option value="ember">Ember (жар очага)</option>
                    </select>
                </label>
            </div>
        </div>
    </div>
    <hr class="sysHR" />
</div>
