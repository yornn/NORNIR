<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- дитя пинает по ночам: луна и пяточка с волнами -->
  <circle cx="24" cy="24" r="19" fill="#2c3145" stroke="#33261c" stroke-width="2"/>
  <circle cx="24" cy="24" r="15.5" fill="none" stroke="#5d6785" stroke-width="1.2" stroke-dasharray="2.2 2"/>
  <!-- ночная луна -->
  <path d="M15 9.5a5.5 5.5 0 1 0 4.6 8.6 6.6 6.6 0 0 1-4.6-8.6z" fill="#d7dceb" stroke="#33261c" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- звёзды -->
  <g fill="#f2cd72">
    <path d="M35 9l.6 1.2 1.2.6-1.2.6-.6 1.2-.6-1.2-1.2-.6 1.2-.6z"/>
    <path d="M40 16l.5 1 1 .5-1 .5-.5 1-.5-1-1-.5 1-.5z"/>
    <circle cx="30" cy="8" r="0.9"/>
  </g>
  <!-- круг утробы ночной -->
  <ellipse cx="24" cy="28" rx="11" ry="10" fill="#3d4358" stroke="#33261c" stroke-width="1.7"/>
  <ellipse cx="24" cy="28" rx="8.5" ry="7.6" fill="none" stroke="#5d6785" stroke-width="1" stroke-dasharray="1.8 1.8"/>
  <!-- пяточка, бьющая в темноте -->
  <path d="M19 30.5c-1.2-2.4.4-5.2 2.8-6 2-.6 4.4.3 5.2 2 1 2.1-.4 4.4-2.4 5.2-1.8.7-4.4.3-5.6-1.2z" fill="#c98d5f" stroke="#33261c" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- волны толчков -->
  <path d="M30.5 24c1.6 1.2 2.8 2.8 3.2 4.8M33 21.5c2.2 1.6 4 3.8 4.5 6.4" fill="none" stroke="#e0a832" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M12 26c-1.2.8-2 2-2.2 3.4M15 23c-1.6.8-2.8 2-3.4 3.6" fill="none" stroke="#e0a832" stroke-width="1.5" stroke-linecap="round"/>
  <!-- искры бессонницы -->
  <path d="M36 34l.6 1.2 1.2.6-1.2.6-.6 1.2-.6-1.2-1.2-.6 1.2-.6z" fill="#f2cd72"/>
  <path d="M11 36l.5 1 1 .5-1 .5-.5 1-.5-1-1-.5 1-.5z" fill="#f2cd72"/>
</svg>
