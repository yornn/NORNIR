  <path d="M17 10h14c0 5-2.5 8-5 9.5v1c2.5 1.5 5 4.5 5 9.5H17c0-5 2.5-8 5-9.5v-1c-2.5-1.5-5-4.5-5-9.5z" fill="#d7dceb" stroke="#33261c" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M15 10h18M15 38h18" stroke="#6e4a26" stroke-width="3" stroke-linecap="round"/>
