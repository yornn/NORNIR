<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- тягота: подняла тяжёлое — камень с верёвкой -->
  <circle cx="24" cy="24" r="19" fill="#ece8dd" stroke="#33261c" stroke-width="2"/>
  <circle cx="24" cy="24" r="15.5" fill="none" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="2.2 2"/>
  <!-- тяжёлый камень -->
  <path d="M24 20c4.5 0 8 1.5 9.5 4 1.2 2 1.5 5 1 7.5-3 1.5-6.8 2-10.5 2s-7.5-.5-10.5-2c-.5-2.5-.2-5.5 1-7.5 1.5-2.5 5-4 9.5-4z" fill="#93a5b8" stroke="#33261c" stroke-width="1.9" stroke-linejoin="round"/>
  <path d="M18 23.5c1.2-1 2.8-1.5 4.5-1.5" fill="none" stroke="#c9d6e2" stroke-width="1.4" stroke-linecap="round"/>
  <!-- верёвка, тянущая вверх -->
  <path d="M24 20V9" stroke="#33261c" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M24 20V9" stroke="#c9a06b" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M22.5 12l3 1.5M22.5 16l3 1.5" stroke="#a9804a" stroke-width="1.1" stroke-linecap="round"/>
  <!-- узел на камне -->
  <path d="M21 20c1-1.5 2-2 3-2s2 .5 3 2c-1 1-2 1.4-3 1.4s-2-.4-3-1.4z" fill="#8a5a33" stroke="#33261c" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- линии напряжения -->
  <path d="M13 13l2 2M35 13l-2 2M10 20h3M35 20h3" stroke="#8f2f24" stroke-width="1.8" stroke-linecap="round"/>
  <!-- трещина усилия на камне -->
  <path d="M26 24l-1.5 2.5 2 2-1.5 3" fill="none" stroke="#5d6785" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- капли пота -->
  <path d="M12 28c0 0-1.5 2-1.5 3a1.5 1.5 0 0 0 3 0c0-1-1.5-3-1.5-3z" fill="#7cb3d4" stroke="#33261c" stroke-width="1"/>
  <path d="M37 28c0 0-1.5 2-1.5 3a1.5 1.5 0 0 0 3 0c0-1-1.5-3-1.5-3z" fill="#7cb3d4" stroke="#33261c" stroke-width="1"/>
