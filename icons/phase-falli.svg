<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Komin at falli: подошедшая к падению — спелый плод у края -->
  <circle cx="24" cy="24" r="19" fill="#f6e7bd" stroke="#33261c" stroke-width="2"/>
  <circle cx="24" cy="24" r="15.5" fill="none" stroke="#a8761e" stroke-width="1.2" stroke-dasharray="2.2 2"/>
  <!-- наклонённая ветвь -->
  <path d="M10 14c6 2 12 6 16 12" fill="none" stroke="#6e4a26" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M14 15.5c2 .6 4 1.6 5.8 3" fill="none" stroke="#8a5a33" stroke-width="1.2" stroke-linecap="round"/>
  <!-- листья -->
  <path d="M16 18c-2.6.4-4.4-.6-5.4-2.8 2.6-.2 4.4.8 5.4 2.8z" fill="#5a8f4f" stroke="#33261c" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M21 22.5c-2.6.4-4.4-.6-5.4-2.8 2.6-.2 4.4.8 5.4 2.8z" fill="#6ba35d" stroke="#33261c" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- спелый плод, готовый упасть -->
  <circle cx="28.5" cy="29" r="6.5" fill="#d96a4a" stroke="#33261c" stroke-width="1.8"/>
  <path d="M25.5 26c1-1.5 2.5-2.3 4.2-2.2" fill="none" stroke="#eda484" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M28.5 22.8c0-1.5.8-2.6 2-3.2" fill="none" stroke="#3c6134" stroke-width="1.6" stroke-linecap="round"/>
  <!-- стрела падения -->
  <path d="M28.5 37v4.5l-2.2-2.6-1.3 1 3.5 4.4 3.5-4.4-1.3-1-2.2 2.6V37z" fill="#8f2f24" stroke="#33261c" stroke-width="1.2" stroke-linejoin="round" transform="translate(6.5,-1)"/>
  <!-- линия земли -->
  <path d="M8 42c5-1.5 11-2 16-2s11 .5 16 2" fill="none" stroke="#6e4a26" stroke-width="2" stroke-linecap="round"/>
</svg>
