<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- нечистая / несвоевременная кровь -->
  <circle cx="24" cy="24" r="19" fill="#f6e7bd" stroke="#33261c" stroke-width="2"/>
  <circle cx="24" cy="24" r="15.5" fill="none" stroke="#8f2f24" stroke-width="1.2" stroke-dasharray="2.2 2"/>
  <!-- тёмная капля со сгустком -->
  <path d="M24 10c0 0-6 7.8-6 11.6a6 6 0 0 0 12 0C30 17.8 24 10 24 10z" fill="#6e1f18" stroke="#33261c" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="22" cy="20" r="1.8" fill="#4a120d"/>
  <circle cx="26" cy="23" r="1.3" fill="#4a120d"/>
  <path d="M21 15.5c.5 1 1.4 1.8 2.5 2" fill="none" stroke="#8f2f24" stroke-width="1.1" stroke-linecap="round"/>
  <!-- зигзаг не-срока (молния) -->
  <path d="M33 12l-3.5 5h2.8l-2.3 5.5 5-6.5h-2.9l3-4z" fill="#e8b84b" stroke="#33261c" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- руна-хагал (нечистое) -->
  <g fill="none" stroke="#5d4a7a" stroke-width="1.8" stroke-linecap="round">
    <path d="M12 30v8M20 30v8M12 34h8"/>
  </g>
  <!-- разбрызг несвоевременности -->
  <g fill="#6e1f18" stroke="#33261c" stroke-width="0.9">
    <circle cx="15" cy="14" r="1.4"/>
    <circle cx="11" cy="20" r="1"/>
    <circle cx="36" cy="27" r="1.2"/>
  </g>
  <!-- нижняя волна мути -->
  <path d="M12 40c2-1.4 4-1.4 6 0s4 1.4 6 0 4-1.4 6 0 4 1.4 6 0" fill="none" stroke="#6e1f18" stroke-width="1.8" stroke-linecap="round"/>
</svg>
