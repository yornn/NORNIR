  <path d="M17 8L31 12.5" stroke="#33261c" stroke-width="1.6" stroke-linecap="round"/>
  <!-- искра тайны -->
  <path d="M38 12l.6 1.2 1.2.6-1.2.6-.6 1.2-.6-1.2-1.2-.6 1.2-.6z" fill="#8d7bab"/>
