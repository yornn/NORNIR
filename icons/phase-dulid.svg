  <path d="M11 33h26" stroke="#33261c" stroke-width="2" stroke-linecap="round"/>
  <path d="M13.5 35.5h21" stroke="#8d7bab" stroke-width="1.3" stroke-dasharray="1.8 1.8" stroke-linecap="round"/>
