  <circle cx="24" cy="24" r="15.5" fill="none" stroke="#8d7bab" stroke-width="1.2" stroke-dasharray="2.2 2"/>
  <!-- холмик под тканью -->
  <path d="M11 33c0-6 3-10 7-12 3-1.6 9-1.6 12 0 4 2 7 6 7 12z" fill="#8d7bab" stroke="#33261c" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- складки ткани -->
  <path d="M16 33c0-4 1-7.5 3-10M24 33V20M32 33c0-4-1-7.5-3-10" fill="none" stroke="#6e5a94" stroke-width="1.5" stroke-linecap="round"/>
