  <g fill="none" stroke="#4a7dab" stroke-width="2" stroke-linecap="round">
    <path d="M32 14c-1.5-1.5-1.5-3 0-4.5" transform="translate(8.5,0)"/>
    <path d="M32 15c-1.5-1.5-1.5-3 0-4.5" transform="translate(4.5,0)"/>
    <path d="M32 14c-1.5-1.5-1.5-3 0-4.5" transform="translate(0.5,0)"/>
