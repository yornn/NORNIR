  <circle cx="21.5" cy="18.5" r="0.75" fill="#33261c"/>
  <circle cx="26.5" cy="18.5" r="0.75" fill="#33261c"/>
  <path d="M22 22c1.2.8 2.8.8 4 0" fill="none" stroke="#33261c" stroke-width="1.1" stroke-linecap="round"/>
