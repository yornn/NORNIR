  <path d="M17 19c0-5 3-8.5 7-8.5s7 3.5 7 8.5c-1.5-2-3.5-3-7-3s-5.5 1-7 3z" fill="#8f2f24" stroke="#33261c" stroke-width="1.5" stroke-linejoin="round"/>
