<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Þverrandi: тяжелеющее лоно — полная чаша клонится вниз -->
  <circle cx="24" cy="24" r="19" fill="#f2ecd8" stroke="#33261c" stroke-width="2"/>
  <circle cx="24" cy="24" r="15.5" fill="none" stroke="#a8761e" stroke-width="1.2" stroke-dasharray="2.2 2"/>
  <!-- чаша, налитая тяжестью -->
  <path d="M14 14h20c0 6-2.5 10.5-6 12.5l-1.5 4h-5l-1.5-4c-3.5-2-6-6.5-6-12.5z" fill="#c9a06b" stroke="#33261c" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="24" cy="14" rx="10" ry="2.4" fill="#8a5a33" stroke="#33261c" stroke-width="1.6"/>
  <!-- тяжёлое содержимое -->
  <ellipse cx="24" cy="14" rx="7.5" ry="1.5" fill="#e0a832"/>
  <!-- ножка и опора -->
  <path d="M18.5 34.5h11" stroke="#33261c" stroke-width="2.4" stroke-linecap="round"/>
  <!-- стрелы тяжести вниз -->
  <g fill="#8f2f24" stroke="#33261c" stroke-width="1.1" stroke-linejoin="round">
    <path d="M15.5 21v6l-2.2-2.6-1.3 1 3.5 4.4 3.5-4.4-1.3-1z"/>
    <path d="M32.5 21v6l-2.2-2.6-1.3 1 3.5 4.4 3.5-4.4-1.3-1z"/>
  </g>
  <!-- капля спелости -->
  <path d="M24 20c0 0-2.2 2.9-2.2 4.3a2.2 2.2 0 0 0 4.4 0c0-1.4-2.2-4.3-2.2-4.3z" fill="#e0a832" stroke="#33261c" stroke-width="1.2"/>
  <path d="M23 23.5c.3.7.9 1.2 1.6 1.3" fill="none" stroke="#f6e7bd" stroke-width="0.9" stroke-linecap="round"/>
</svg>
